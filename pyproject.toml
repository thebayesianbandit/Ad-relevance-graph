[project]
name = "ad-relevance-model"
version = "0.1.0"
description = ""
authors = [
    {name = "Brandon",email = "thebscotte@gmail.com"}
]
readme = "README.md"
requires-python = ">=3.10,<3.15"
dependencies = [
    "torch-geometric (>=2.7.0,<3.0.0)",
    "pytorch-lightning (>=2.6.5,<3.0.0)",
    "polars (>=1.41.2,<2.0.0)",
    "torch (>=2.12.0,<3.0.0)",
    "mlflow (>=3.13.0,<4.0.0)",
    "fastapi (>=0.136.3,<0.137.0)",
    "uvicorn (>=0.49.0,<0.50.0)"
]

[tool.poetry]
packages = [{include = "ad_relevance_model", from = "src"}]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "pytest (>=9.0.3,<10.0.0)"
]
