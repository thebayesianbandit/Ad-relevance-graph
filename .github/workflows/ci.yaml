# .github/workflows/ci.yaml
name: Continuous Integration Gate

# Trigger this pipeline automatically on any git push or pull request to the main branch
on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  quality-gate:
    runs-on: ubuntu-latest
    
    steps:
    # 1. Clone your repository layout into the cloud container
    - name: Checkout Code Repository
      uses: actions/checkout@v4

    # 2. Set up Python matching your environment configuration
    - name: Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    # 3. Install and configure Poetry globally on the runner
    - name: Install Poetry
      uses: snok/install-poetry@v1
      with:
        virtualenvs-create: true
        virtualenvs-in-project: true
        installer-parallel: true

    # 4. Cache your virtual environment so your pipeline runs in seconds, not minutes
    - name: Load Cached Virtual Environment
      id: cached-poetry-dependencies
      uses: actions/cache@v4
      with:
        path: .venv
        key: venv-${{ runner.os }}-${{ hashFiles('**/poetry.lock') }}

    # 5. Install project dependencies
    - name: Install Project Dependencies
      run: poetry install --no-interaction --no-root

    # 6. Execute the Automated Quality Gate
    - name: Run Pytest Suite
      run: |
        poetry run pytest tests/
